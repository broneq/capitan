name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time, never cancelled: the publish job is the single
# writer of the release branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The App token makes release PRs and tags trigger the normal PR CI,
      # which GITHUB_TOKEN would not.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The marketplace installs capitan from the release branch, so users get
  # released versions only. The plugin is the repository root, so publishing
  # is a fast-forward of release to the release tag.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Fast-forward the release branch to the release tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Publishing: $TAG"
          git push origin "refs/tags/${TAG}^{commit}:refs/heads/release"
