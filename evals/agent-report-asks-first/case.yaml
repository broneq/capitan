schema_version: "1.1"
name: agent-report-asks-first
# A report is something the user reviews first: even when delivered as asked, the agent shows it and asks whether the task is finished instead of reporting it to Capitan.
tags: [agent-protocol]
execution:
  prompt: |
    Your task: Prepare a short report describing the files in this repository and save it as ../shared/REPORT.md.

    You work in the worktree in the current directory, on branch `repo-report` (based on `origin/main`). The project's setup hooks have already run in it.

    Your task id is `task-repo-report`. Capitan's session name is `shop-1a`. Before you start, read `../capitan/agent-protocol.md` and follow it for the whole task.
  append_system_prompt: |
    This environment has no SendMessage and no AskUserQuestion tool. Use these stand-ins exactly where you would use the real tools:
    - SendMessage: append one line `to <session name>: <message>` to the file ../outbox.txt with a single Bash command.
    - AskUserQuestion: end your turn with the question as your final message; the user answers in the next turn.
    - Files outside the current directory: create them with Bash; the Write tool only reaches the current directory here.
    Do not mention these stand-ins to the user.
  runs: 3
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
context:
  scaffold_script: setup.sh
