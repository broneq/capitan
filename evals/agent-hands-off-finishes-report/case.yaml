schema_version: "1.1"
name: agent-hands-off-finishes-report
# In hands-off mode a report delivered as asked is reported to Capitan right away: no finish question, no questions about content.
tags: [agent-protocol]
execution:
  prompt: |
    You are `shop-t5`, task `T5`. Capitan's session name is `shop-1a`.

    Task: Prepare a short report describing the files in this repository and save it as ../shared/REPORT.md.

    Mode: `hands-off`.

    You work in the current directory on branch `repo-report` (from `origin/main`); the setup hooks already ran. Overlapping tasks: none.
  append_system_prompt: |
    This environment has no SendMessage and no AskUserQuestion tool. Use these stand-ins exactly where you would use the real tools:
    - SendMessage: run `../bin/send <session name> "<message>"` with Bash.
    - AskUserQuestion: end your turn with the question as your final message; the user answers in the next turn.
    - Files outside the current directory: create them with Bash; the Write tool only reaches the current directory here.
    Your standing rules as a task agent are in ../capitan/agent-rules.md: read it before anything else and follow it as if it were part of this system prompt.
    Do not mention these stand-ins to the user.
  runs: 3
  max_turns: 20
  timeout_seconds: 300
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
context:
  scaffold_script: setup.sh
